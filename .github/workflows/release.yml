name: Build and Deploy

on:
  push:
    branches:
      - master
    paths:
      - apps/ui/**
      - .github/workflows/release.yml
  pull_request:
    branches:
      - master
    paths:
      - apps/ui/**
      - .github/workflows/release.yml
  workflow_dispatch: # allow manual trigger
jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: macos-12
    name: Wine Mac Apps Release
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.14.0'
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '10.9.0'
      - name: Install dependencies
        run: pnpm install
      - name: Bump patch version
        if: github.ref_name == 'master' && github.event_name == 'push'
        run: pnpm ui:bump-patch-version
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: actions@github.com
      - name: Build
        run: pnpm ui:build:mac
      - name: Get package version
        if: github.ref_name == 'master' && github.event_name == 'push'
        run: |
          VERSION=$(jq -r .version < ./apps/ui/package.json)
          echo $VERSION
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Create Release
        if: github.ref_name == 'master' && github.event_name == 'push'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION }}
          release_name: Release v${{ env.VERSION }}
          body: 'Automatically generated release for version ${{ env.VERSION }}'
          draft: false
          prerelease: false
      - name: Upload bundled files
        if: github.ref_name == 'master' && github.event_name == 'push'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: './apps/ui/dist/Wine Mac Center.zip'
          asset_name: Wine Mac Center.zip
          asset_content_type: application/zip
      - name: Commit bumped version
        if: github.ref_name == 'master' && github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add apps/ui/package.json # adjust if your bump affects more files
          VERSION=$(node -p "require('./apps/ui/package.json').version")
          git commit -m "chore: bump version to v$VERSION [skip ci]"
          git tag v$VERSION

      - name: Push changes and tag
        if: github.ref_name == 'master' && github.event_name == 'push'
        run: |
          git push origin HEAD
          git push origin --tags
